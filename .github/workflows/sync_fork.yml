name: Fork Sync

on:
  schedule:
    - cron: "0 0 * * *" # 00:00 UTC / 北京时间 08:00
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-sync-main
  cancel-in-progress: false

jobs:
  sync_with_upstream:
    name: Sync with Upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event.repository.fork }}
    env:
      UPSTREAM_REPOSITORY: huangxd-/danmu_api
      UPSTREAM_BRANCH: main
      TARGET_BRANCH: main

    steps:
      - name: Check sync credential
        env:
          SYNC_KEY: ${{ secrets.FORK_SYNC_SSH_KEY }}
        run: |
          if [ -z "$SYNC_KEY" ]; then
            echo "::error::Set FORK_SYNC_SSH_KEY to a write-enabled deploy key for this repository."
            exit 1
          fi

      - name: Checkout target repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          # GITHUB_TOKEN cannot push upstream changes to workflow files.
          # This deploy key is scoped to this repository only.
          ssh-key: ${{ secrets.FORK_SYNC_SSH_KEY }}

      - name: Merge and push upstream
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream \
            "+refs/heads/${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}"
          upstream_ref="refs/remotes/upstream/${UPSTREAM_BRANCH}"

          if git merge-base --is-ancestor "$upstream_ref" HEAD; then
            echo "Already up to date with ${UPSTREAM_REPOSITORY}:${UPSTREAM_BRANCH}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          before="$(git rev-parse HEAD)"
          git merge --no-edit --no-stat "$upstream_ref"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          after="$(git rev-parse HEAD)"
          echo "Synced ${UPSTREAM_REPOSITORY}:${UPSTREAM_BRANCH}: ${before} -> ${after}" >> "$GITHUB_STEP_SUMMARY"
